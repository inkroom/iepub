[package]
name = "iepub"
readme = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
description = { workspace = true }
rust-version = { workspace = true }

[dependencies]
zip = "9.3.0"
quick-xml = { version = "0.42.0" }
ab_glyph = { version = "0.2.32", optional = true }
imageproc = { version = "0.27.0", optional = true}
serde_json = { version = "1.0.154", optional = true }
iepub-derive = { path = "../derive", version = "1.3.8" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
css-inline = {version = "0.23.1", default-features = false, features = ["file"]}
image = { version = "0.25.10", default-features = false, features = ["jpeg"], optional = true }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking"] }

[features]
no_nav = []
cache = ["dep:serde","dep:serde_json"]
cover = ["dep:ab_glyph","dep:image","dep:imageproc"]
